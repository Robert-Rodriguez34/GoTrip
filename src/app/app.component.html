
<ion-app>

  <!-- MENÚ LATERAL GLOBAL -->
  <ion-menu
    contentId="main-content"
    type="overlay"
    menuId="main-menu">

    <!-- ENCABEZADO DEL MENÚ -->
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-header">

        <div class="menu-brand">
          <img src="assets/icon/logo.png" alt="GoTrip">

          <div>
            <strong>GoTrip</strong> 
            <small>Robert Rodríguez</small>
          </div>
        </div>

      </ion-toolbar>
    </ion-header>

    <!-- OPCIONES DE NAVEGACIÓN -->
    <ion-content>

      <ion-item class="menu-label">
        <ion-label>MENÚ PRINCIPAL</ion-label>
      </ion-item>

      <ion-list lines="none" class="menu-list">

        @for (item of pages; track item.url) {

          <ion-menu-toggle menu="main-menu" [autoHide]="true">

            <ion-item
              [routerLink]="item.url"
              routerDirection="root"
              routerLinkActive="selected"
              [routerLinkActiveOptions]="{ exact: true }"
              detail="false"
              button>

              <ion-icon
                slot="start"
                [name]="item.icon">
              </ion-icon>

              <ion-label>
                {{ item.title }}
              </ion-label>

              <ion-icon
                slot="end"
                name="chevron-forward-outline"
                class="menu-arrow">
              </ion-icon>

            </ion-item>

          </ion-menu-toggle>

        }

      </ion-list>

    </ion-content>

  </ion-menu>

  <!-- CONTENIDO DE LAS PÁGINAS -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
